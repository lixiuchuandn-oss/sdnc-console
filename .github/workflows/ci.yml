name: CI

# 质量门禁：对指向 main 的 PR 自动校验前后端「类型 → lint → 测试 → 构建」（合入后不再重复跑，见 docs/ci.md）。
# 本地复现与 Branch protection 配置见 docs/ci.md。
# 前端 npm scripts 已使用 cross-env；CI 仍显式设置 env，便于复现底层工具调用。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支/PR 的并发运行只保留最新一次，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tsc / lint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Lint (zero warnings)
        run: npm run lint
      - name: Unit tests (jest)
        run: npx jest --ci
      - name: Build (tsc)
        run: npx tsc

  format:
    name: Format (prettier backend + docs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prettier check
        run: npm run format:check

  frontend:
    name: Frontend (tsc / eslint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prettier check
        run: npm run format:check
      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: ESLint (zero warnings)
        run: npm run lint
      - name: Unit tests (jest via react-scripts)
        run: npx react-scripts test --watchAll=false
      - name: Production build
        run: npx react-scripts build
