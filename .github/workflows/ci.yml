name: CI

# 质量门禁：对指向/推送到 main 的改动自动校验前后端「类型 → lint → 测试 → 构建」。
# 本地复现与 Branch protection 配置见 docs/ci.md。
# 注意：仓库内 package.json 的 dev/build 脚本使用 Windows 风格的 `set VAR=...`，
# 在 Linux runner 上不会真正注入环境变量，因此这里直接调用底层工具并显式设置 env。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支/PR 的并发运行只保留最新一次，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tsc / lint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Lint (errors fail; warnings allowed)
        run: npm run lint
      - name: Unit tests (jest)
        run: npx jest --ci
      - name: Build (tsc)
        run: npx tsc

  frontend:
    name: Frontend (tsc / eslint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: ESLint (zero warnings)
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0
      - name: Unit tests (jest via react-scripts)
        run: npx react-scripts test --watchAll=false
      - name: Production build
        run: npx react-scripts build
