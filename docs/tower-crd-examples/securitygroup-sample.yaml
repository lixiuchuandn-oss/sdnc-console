---
# 示例：扁平子网安全组（规则 + VM 成员）
# 规则语义与 Tower kubeOvnAclRules 一致；ACL 展开下发仍可由 Tower 或 controller reconcile。
apiVersion: tower.rivercloud.com/v1
kind: SecurityGroup
metadata:
  name: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
  labels:
    tower.io/cloud-id: cloud-abc123
    tower.io/subnet-name: flat-net-01
    tower.io/managed-by: tower
spec:
  id: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
  cloudId: cloud-abc123
  name: sg-web-allow-http
  description: 允许成员 VM 入向 80/443
  subnetName: flat-net-01
  rules:
    - id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      priority: 32000
      direction: from-lport
      action: allow
      match: 'tcp && tcp.dst == 80'
    - id: 8d9e6679-7425-40de-944b-e07fc1f90ae8
      priority: 32010
      direction: from-lport
      action: allow
      match: 'tcp && tcp.dst == 443'
    - id: 9e0e6679-7425-40de-944b-e07fc1f90ae9
      priority: 32100
      direction: to-lport
      action: allow
      match: 'tcp'
  members:
    - id: a1ae6679-7425-40de-944b-e07fc1f90ae0
      vmNamespace: default
      vmName: vm-web-01
    - vmNamespace: default
      vmName: vm-web-02
